spring.application.name=fnts-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fnts}
spring.datasource.username=${DB_USER:fnts}
spring.datasource.password=${DB_PASSWORD:fnts}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minutes=15
app.refresh.ttl-days=7
app.secure-cookies=${SECURE_COOKIES:false}

app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# Feedback briefings. Blank keys disable the pipeline: feedback is still
# stored, just never summarised or emailed.
app.feedback.gemini-api-key=${GEMINI_API_KEY:}
app.feedback.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}
app.feedback.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.feedback.notify-to=${FEEDBACK_NOTIFY_TO:}
app.feedback.notify-from=${MAIL_USERNAME:}

# Gmail SMTP (use an App Password, never the account password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
