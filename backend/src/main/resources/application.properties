spring.application.name=fnts-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fnts}
spring.datasource.username=${DB_USER:fnts}
spring.datasource.password=${DB_PASSWORD:fnts}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
# Adding spring-boot-starter-mail makes Actuator probe the SMTP server on
# every health check. An unreachable (or unconfigured) mail server must not
# make the whole app look dead — the feedback pipeline degrades on its own.
management.health.mail.enabled=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-ttl-minutes=15
app.refresh.ttl-days=7
app.secure-cookies=${SECURE_COOKIES:false}

# Base64 32-byte AES key encrypting sensitive free-text at rest (habit names,
# descriptions, miss reasons, feedback). Generate: openssl rand -base64 32
# WARNING: losing this key permanently destroys that data. Back it up.
app.crypto.key=${DATA_ENCRYPTION_KEY:}

app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:mailto:admin@example.com}

# Feedback briefings. Blank keys disable the pipeline: feedback is still
# stored, just never summarised or emailed.
app.feedback.gemini-api-key=${GEMINI_API_KEY:}
# "-latest" alias tracks the current flash model, so a pinned name going
# new-user-gated (as gemini-2.5-flash did) can't silently break this.
app.feedback.gemini-model=${GEMINI_MODEL:gemini-flash-latest}
app.feedback.gemini-base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.feedback.notify-to=${FEEDBACK_NOTIFY_TO:}
app.feedback.notify-from=${MAIL_USERNAME:}

# Gmail SMTP (use an App Password, never the account password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
